# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: sensor-wohnzimmer
  friendly_name: sensor-wohnzimmer

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: sensor-wohnzimm Fallback Hotspot
    password: !secret fallback_ap_password

captive_portal:

i2c:
  sda: GPIO21
  scl: GPIO22

sensor:
  - platform: sht3xd
    temperature:
      name: "Temperatur Wohnzimmer"
    humidity:
      name: "Luftfeuchtigkeit Wohnzimmer"
    address: 0x44