# Runs in LXC 106. Recreates the original `docker run` setup; all other settings are image defaults.
services:
  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_VERSION}
    # bin/tailscale-cert-renew.sh restarts the container by this name
    container_name: vaultwarden
    restart: always
    ports:
      - "443:80/tcp"
    volumes:
      - /vw-data/:/data/
    environment:
      DOMAIN: ${DOMAIN}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED}
      ROCKET_TLS: ${ROCKET_TLS}
