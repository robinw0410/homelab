dir: local
	path /var/lib/vz
	content iso,backup,import,vztmpl

lvmthin: local-lvm
	thinpool data
	vgname pve
	content rootdir,images

dir: storage
	path /mnt/pve/storage
	content snippets,vztmpl,images,backup,rootdir,iso
	is_mountpoint 1
	nodes pve

dir: hdd-backup
	path /mnt/media/pve-backup
	content backup
	is_mountpoint /mnt/media
	prune-backups keep-daily=7,keep-weekly=4,keep-monthly=3

