arch: amd64
cores: 2
features: nesting=1
hostname: jellyfin
memory: 4096
mp0: /mnt/media,mp=/data
nameserver: 192.168.x.x
net0: name=eth0,bridge=vmbr0,firewall=1,gw=192.168.x.x,hwaddr=XX:XX:XX:XX:XX:XX,ip=192.168.x.x/24,type=veth
onboot: 1
ostype: ubuntu
rootfs: local-lvm:vm-101-disk-0,size=20G
swap: 4096
unprivileged: 1
lxc.cgroup2.devices.allow: c 226:0 rwm
lxc.cgroup2.devices.allow: c 226:128 rwm
lxc.mount.entry: /dev/dri/renderD128 dev/dri/renderD128 none bind,optional,create=file
