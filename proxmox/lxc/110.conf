arch: amd64
cores: 4
features: nesting=1
hostname: immich
memory: 6144
mp0: /mnt/pve/storage/immich-data,mp=/mnt/photos
nameserver: 192.168.x.x
net0: name=eth0,bridge=vmbr0,firewall=1,gw=192.168.x.x,hwaddr=XX:XX:XX:XX:XX:XX,ip=192.168.x.x/24,type=veth
onboot: 1
ostype: ubuntu
rootfs: local-lvm:vm-110-disk-0,size=20G
swap: 6144
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
